# Builds Orbit Client for each version tag (v1.2.3) and attaches the jar to a GitHub release.
# Orbit Launcher downloads the newest release's jar.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fabric Loom 1.19 runs on Java 25; the mod itself still targets Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}" --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          name: Orbit Client ${{ github.ref_name }}
          files: |
            build/libs/orbit-client-*.jar
            !build/libs/*-sources.jar
          body: |
            Orbit Client for Minecraft 1.21.11 (Fabric). Needs Fabric API.
            Orbit Launcher installs and updates it automatically.
