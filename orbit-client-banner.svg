    <ellipse rx="250" ry="88" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <ellipse rx="204" ry="72" fill="none" stroke="#789dff" stroke-opacity=".32" stroke-width="1.5"/>
    <circle r="100" fill="#080a15" stroke="#9b8aff" stroke-opacity=".85" stroke-width="3"/>
