<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Client</title>
  <desc id="desc">A Minecraft client mod that moves with you.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".55" stop-color="#11152d"/><stop offset="1" stop-color="#080b19"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8872ff" stop-opacity=".6"/><stop offset="1" stop-color="#5445c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop stop-color="#6daaff" stop-opacity=".1"/><stop offset=".45" stop-color="#a99aff"/><stop offset=".75" stop-color="#62d9ff"/><stop offset="1" stop-color="#7370f6" stop-opacity=".2"/></linearGradient>
    <linearGradient id="text" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9c5ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
