plugins {
	// Picks fabric-loom-remap (obfuscated, before 26.1) or fabric-loom (unobfuscated, 26.1+) per version.
	id 'dev.kikugie.loom-back-compat'
}

def mc = stonecutter.current.version
def unobfuscated = stonecutter.current.parsed.matches('>=26.1')

version = "${project.mod_version}+${mc}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	loomx.applyMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('deps.fabric_api')}"
}

// Client game tests: `gradlew runClientGameTest` opens a world and screenshots the menus (run/screenshots).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "orbitclient-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// Names that changed between versions, rewritten in the sources for the version being built.
stonecutter {
	replacements.string(unobfuscated) {
		replace 'GuiGraphics', 'GuiGraphicsExtractor'
		replace 'com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline'
		replace 'net.minecraft.client.renderer.state.CameraRenderState', 'net.minecraft.client.renderer.state.level.CameraRenderState'
	}
}

processResources {
	def props = [version: project.version, minecraft: project.property('deps.minecraft_range')]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

// 26.x needs Java 25; 1.21.x runs on Java 21.
def javaVersion = unobfuscated ? 25 : 21
tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}